name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 仓级 .cargo/config.toml 设 build.rustc-wrapper="sccache"（跨 worktree
      # 编译缓存，见该文件注释），runner 默认无 sccache 会直接 build 失败。
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.8
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=2
        timeout-minutes: 10
