name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 仓级 .cargo/config.toml 设 build.rustc-wrapper="sccache"（跨 worktree
      # 编译缓存，见该文件注释），runner 默认无 sccache 会直接 build 失败。
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # python harness 的判定语义靠样张钉住（语境/豁免口径极易回归，见文件头）
      - name: Harness self-test (python)
        run: python3 specs/harness/test_css_token_guard.py
      - name: Distribution self-test (python)
        run: python3 scripts/test_canon_sync.py
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        # --workspace 是硬要求：根包+workspace 布局下裸 cargo test 只跑根包，
        # crates/*（gate/mcp/flow/check-*）的测试全部静默不跑（2026-10-15 实测：
        # 日志只出现根包 canon 的 2 个测试）。见根 AGENTS.md 同一坑的记载。
        run: cargo test --locked --workspace --all-targets --no-fail-fast -- --test-threads=2
        timeout-minutes: 20
