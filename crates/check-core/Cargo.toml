[package]
name = "check-core"
version = "0.1.0"
edition = "2024"
description = "Shared substrate for canon rule crates: Finding/Class vocabulary, Rule trait, registry/runner, rule kinds and CLI glue"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
