[package]
name = "check-dioxus"
version = "0.1.0"
edition = "2024"
description = "Dioxus rsx structural rules for canon rule crates: one-rsx-per-component, nesting depth, CJK text, list keys"
publish = false

[dependencies]
check-core = { path = "../check-core" }
dioxus-rsx = "0.7"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
