[package]
name = "canon-flow-web"
version = "0.5.17"
edition = "2021"
description = "canon flow 本地看板 web（Dioxus wasm + ui-kit）：P1 项目面板 / P2 项目页"
publish = false

# 独立 package（自带 Cargo.lock，不进根 workspace）：wasm 目标与 native
# workspace 构建隔离，ui-kit demo 同款先例。

[[bin]]
name = "canon-flow-web"
path = "src/main.rs"


# 独立包：不随根 workspace 构建（wasm 目标 + 自带 lock + ui-kit git dep）
[workspace]

[dependencies]
# 本地迭代用 path（ui-kit 仓 README 既定：勿提交 path 进远端 CI）；
# 发版/CI 切回 git 钉 tag：ui-kit = { git = "https://github.com/hathawayANdRX105/ui-kit", tag = "v0.12.15" }
#
# 临时改法（2026-10-02）：ui-kit 工作树有坏编辑（avatar_menu.rs 括号不平衡，15:21 起），
# path 依赖跟着编不过 → 钉本地仓已提交 HEAD（7ef4532；领先 origin/main 2 提交但仅动
# AGENTS.md/justfile，src 与远端一致）。ui-kit 工作树修好后切回 path。
ui-kit = { git = "file:///home/hathaway/projects/ui-kit", rev = "7ef4532" }
dioxus = { version = "=0.7.10", features = ["web", "lib", "launch"] }
# 纯模型 + 转移规则 + 模板（不含 rusqlite store，wasm 安全）
flow = { path = "../flow", default-features = false }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
