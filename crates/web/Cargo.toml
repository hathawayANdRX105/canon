[package]
name = "canon-flow-web"
version = "0.5.17"
edition = "2021"
description = "canon flow 本地看板 web（Dioxus wasm + ui-kit）：P1 项目面板 / P2 项目页"
publish = false

# 独立 package（自带 Cargo.lock，不进根 workspace）：wasm 目标与 native
# workspace 构建隔离，ui-kit demo 同款先例。

[[bin]]
name = "canon-flow-web"
path = "src/main.rs"


# 独立包：不随根 workspace 构建（wasm 目标 + 自带 lock + ui-kit git dep）
[workspace]

[dependencies]
# 本地迭代用 path（ui-kit 仓 README 既定：勿提交 path 进远端 CI）；
# 发版/CI 切回 git 钉 tag：ui-kit = { git = "https://github.com/hathawayANdRX105/ui-kit", tag = "v0.12.15" }
ui-kit = { path = "../../../ui-kit" }
dioxus = { version = "=0.7.10", features = ["web", "lib", "launch"] }
# 纯模型 + 转移规则 + 模板（不含 rusqlite store，wasm 安全）
flow = { path = "../flow", default-features = false }
gloo-net = "0.6"

[profile.release]
opt-level = "s"
lto = true
