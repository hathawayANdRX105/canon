[package]
name = "check-rust"
version = "0.1.0"
edition = "2024"
description = "Rust source-structure rules for canon rule crates: test placement, cfg(test) in tests/, dead_code allow"
publish = false

[dependencies]
check-core = { path = "../check-core" }
globset = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
