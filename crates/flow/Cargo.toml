[package]
name = "flow"
version = "0.5.17"
edition = "2024"
description = "canon flow: workflow recording + task claiming — Project/Task(state)/Step + journal"
publish = false

[dependencies]
gate = { path = "../gate", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[features]
default = ["store"]
store = ["dep:rusqlite", "dep:gate"]
serve = ["store"]

[[test]]
name = "serve"
required-features = ["serve"]

[dev-dependencies]
tempfile = "3"
