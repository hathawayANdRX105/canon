[package]
name = "check-assets"
version = "0.1.0"
edition = "2024"
description = "Front-end asset rules for canon rule crates: CSS block invariants (theme token mirroring)"
publish = false

[dependencies]
check-core = { path = "../check-core" }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
