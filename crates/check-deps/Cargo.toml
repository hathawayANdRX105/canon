[package]
name = "check-deps"
version = "0.1.0"
edition = "2024"
description = "Dependency-graph rules for canon rule crates: domain edge denials via cargo metadata, cargo-machete translation"
publish = false

[dependencies]
check-core = { path = "../check-core" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
