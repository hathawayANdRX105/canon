[package]
name = "gate"
version = "0.5.12"
edition = "2024"
description = "Spec-driven quality gate: yaml rules + external harnesses, zero detection logic in the engine"
license = "MIT"
publish = false

[lib]
name = "gate"
path = "src/lib.rs"

[[bin]]
name = "gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
