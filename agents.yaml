# agents.yaml — 项目 AGENTS.md 的章节组合计划（canon 正本）
#
# 模型：canon 持有全部内容，各项目 AGENTS.md 是**生成物**。
#   specs/agents/fragments/   共享章节（跨项目复用，改一处全体受益）
#   specs/agents/local/<项目>  项目独有内容（架构约定、目录规则、坑）
# 这里声明每个项目「包含哪些章节、什么顺序、什么参数」。
#
# include 条目：
#   - _discipline            共享片段（fragments/ 下）
#   - local/deskctl          项目独有片段（local/ 下，名字可省 = 当前项目）
#   - {fragment: x, title: Y} 显式指定标题
# 片段里的 {{param}} 由该项目 params 替换；缺参数会报警，不静默填空。
#
# 用法：bin/agents list | show <项目> | build <项目> | push <项目> | status
#
# 改动纪律：共享章节改 fragments/；项目独有改 local/<项目>.md；
# 改完 `bin/agents push <项目>` 重新生成，再提交项目仓。

defaults:
  titles:
    _discipline: 发现处置纪律
    project-structure: 本仓结构
    architecture: 目录与架构
    code-style: 代码风格
    build-verify: 构建与验证
    git-workflow: 提交与 PR
    tools: 工具与命令
    subagents: 子代理与并行

# 每个项目的 include = [项目独有内容] + 共享章节（按此顺序组装）。
# 共享片段按需引用，不必全带；项目特殊要求可在项目级 titles 覆盖标题。
projects:
  oh-my-pi:
    root: /home/hathaway/projects/oh-my-pi
    titles: {local/: oh-my-pi 开发约定}
    include: [local/, _discipline, code-style, build-verify, git-workflow, tools]

