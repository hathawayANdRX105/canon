enabled: true
# 根目录无 manifest (如 canon 的嵌套 workspace bin/gate) 时跳过, 防假 FAIL
command: sh
args: ["-c", "ms=$(git ls-files | grep -E '(^|/)Cargo.toml$'); [ -z \"$ms\" ] && exit 0; rc=0; for m in $ms; do (cd \"$(dirname \"$m\")\" && cargo fmt --check) || rc=1; done; exit $rc"]
fail_severity: FAIL
paths_include: ["**/*.rs"]
paths_exclude: ["target/", ".wt/"]
