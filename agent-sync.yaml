        to: .agent/rules/pr-workflow.md
      - src: agent/ferrite/rules/testing-ci.md
        to: .agent/rules/testing-ci.md
      - src: agent/ferrite/rules/web-lanes.md
        to: .agent/rules/web-lanes.md
      - src: agent/ferrite/skills/ainotation-web/SKILL.md
        to: .agent/skills/ainotation-web/SKILL.md
      - src: agent/ferrite/skills/gate-checklist/SKILL.md
